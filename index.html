<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapSphere - Image Search</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="sticky-header">
    <h1>SnapSphere</h1>
    <p>Discover stunning images in high resolution.</p>
  </header>

  <main>
    <form id="search-form">
      <label for="search-input" class="sr-only">Search images</label>
      <input id="search-input" type="search" placeholder="Search for nature, architecture..." />
      <button id="search-button" type="submit">Search</button>
      <button id="clear-button" type="reset">Clear</button>
    </form>

    <div class="category-chips">
      <button type="button" class="chip">Nature</button>
      <button type="button" class="chip">Cities</button>
      <button type="button" class="chip">Animals</button>
    </div>

    <p id="empty-state">Search to see results</p>
    <section id="results"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
